    <text x="-202" y="19" text-anchor="middle" font-family="system-ui, monospace" font-size="12" fill="#00d4aa" font-weight="500">NEXT.JS</text>
    <rect x="-155" y="0" width="55" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="-127" y="19" text-anchor="middle" font-family="system-ui, monospace" font-size="12" fill="#61dafb" font-weight="500">REACT</text>
    <rect x="-90" y="0" width="85" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="-47" y="19" text-anchor="middle" font-family="system-ui, monospace" font-size="12" fill="#3178c6" font-weight="500">TYPESCRIPT</text>
    <rect x="5" y="0" width="65" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="37" y="19" text-anchor="middle" font-family="system-ui, monospace" font-size="12" fill="#339933" font-weight="500">NODE.JS</text>
    <rect x="80" y="0" width="85" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="122" y="19" text-anchor="middle" font-family="system-ui, monospace" font-size="12" fill="#4169e1" font-weight="500">POSTGRESQL</text>
    <rect x="175" y="0" width="75" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
