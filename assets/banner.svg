    <circle cx="150" cy="130" r="3" fill="#58a6ff"/>
    <path d="M1050 300 L1100 300 L1100 250 L1150 250"/>
    <circle cx="1050" cy="300" r="3" fill="#a855f7"/>
    <circle cx="1150" cy="250" r="3" fill="#a855f7"/>
    <path d="M80 350 L80 400 L130 400"/>
    <circle cx="80" cy="350" r="3" fill="#00d4aa"/>
    <circle cx="130" cy="400" r="3" fill="#00d4aa"/>
  </g>

  <rect x="2" y="2" width="1196" height="436" rx="10" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="150" y="215" width="900" height="2" fill="url(#lineGrad)" filter="url(#glow)"/>

  <text x="600" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="8">BESHAH ASHENAFI</text>
  <text x="600" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#8b949e" letter-spacing="6">FULL STACK DEVELOPER</text>

  <g transform="translate(600, 310)">
