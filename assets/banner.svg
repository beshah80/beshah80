<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" rx="12"/>

  <g opacity="0.08" stroke="#58a6ff" stroke-width="1" fill="none">
    <path d="M50 80 L100 80 L100 130 L150 130"/>
    <circle cx="50" cy="80" r="3" fill="#58a6ff"/>
    <circle cx="150" cy="130" r="3" fill="#58a6ff"/>
    <path d="M1050 300 L1100 300 L1100 250 L1150 250"/>
    <circle cx="1050" cy="300" r="3" fill="#a855f7"/>
    <circle cx="1150" cy="250" r="3" fill="#a855f7"/>
  </g>

  <rect x="150" y="215" width="900" height="2" fill="url(#lineGrad)" filter="url(#glow)"/>

  <text x="600" y="175" text-anchor="middle" font-family="'Chakra Petch', 'Rajdhani', sans-serif" font-size="64" font-weight="600" fill="#ffffff" letter-spacing="6">BESHAH ASHENAFI</text>
  
  <text x="600" y="245" text-anchor="middle" font-family="'Chakra Petch', system-ui, sans-serif" font-size="20" fill="#8b949e" letter-spacing="4">FULL STACK DEVELOPER</text>

  <g transform="translate(600, 300)">
    <rect x="-240" y="0" width="75" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="-202" y="19" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="12" fill="#00d4aa">NEXT.JS</text>
    <rect x="-155" y="0" width="55" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="-127" y="19" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="12" fill="#61dafb">REACT</text>
    <rect x="-90" y="0" width="85" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="-47" y="19" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="12" fill="#3178c6">TYPESCRIPT</text>
    <rect x="5" y="0" width="65" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="37" y="19" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="12" fill="#339933">NODE.JS</text>
    <rect x="80" y="0" width="85" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="122" y="19" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="12" fill="#4169e1">POSTGRESQL</text>
    <rect x="175" y="0" width="75" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="212" y="19" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="12" fill="#a855f7">SOCKET.IO</text>
  </g>

  <circle cx="150" cy="216" r="4" fill="#00d4aa" filter="url(#glow)"/>
  <circle cx="1050" cy="216" r="4" fill="#a855f7" filter="url(#glow)"/>
</svg>
