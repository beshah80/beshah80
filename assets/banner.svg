<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <g opacity="0.03" fill="none" stroke="#ffffff" stroke-width="0.5">
    <circle cx="100" cy="100" r="50"/>
    <circle cx="1100" cy="320" r="80"/>
    <rect x="80" y="280" width="60" height="60" rx="4"/>
    <rect x="1040" y="80" width="80" height="40" rx="4"/>
  </g>

  <rect x="200" y="200" width="800" height="2" fill="url(#accent)"/>

  <text x="600" y="165" text-anchor="middle" font-family="'Chakra Petch', 'Rajdhani', 'Orbitron', sans-serif" font-size="64" font-weight="600" fill="#ffffff" letter-spacing="4">BESHAH ASHENAFI</text>

  <text x="600" y="235" text-anchor="middle" font-family="'Chakra Petch', system-ui, sans-serif" font-size="20" fill="#a0a0b0" letter-spacing="2">FULL STACK DEVELOPER</text>

  <g transform="translate(600, 280)">
    <rect x="-220" y="0" width="70" height="24" rx="12" fill="#1e1e2e" stroke="#333" stroke-width="1"/>
    <text x="-185" y="16" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="11" fill="#00d4aa">NEXT.JS</text>

    <rect x="-135" y="0" width="50" height="24" rx="12" fill="#1e1e2e" stroke="#333" stroke-width="1"/>
    <text x="-110" y="16" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="11" fill="#61dafb">REACT</text>

    <rect x="-70" y="0" width="80" height="24" rx="12" fill="#1e1e2e" stroke="#333" stroke-width="1"/>
    <text x="-30" y="16" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="11" fill="#3178c6">TYPESCRIPT</text>

    <rect x="15" y="0" width="60" height="24" rx="12" fill="#1e1e2e" stroke="#333" stroke-width="1"/>
    <text x="45" y="16" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="11" fill="#339933">NODE.JS</text>

    <rect x="90" y="0" width="80" height="24" rx="12" fill="#1e1e2e" stroke="#333" stroke-width="1"/>
    <text x="130" y="16" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="11" fill="#4169e1">POSTGRESQL</text>

    <rect x="185" y="0" width="70" height="24" rx="12" fill="#1e1e2e" stroke="#333" stroke-width="1"/>
    <text x="220" y="16" text-anchor="middle" font-family="'Chakra Petch', monospace" font-size="11" fill="#7c3aed">SOCKET.IO</text>
  </g>

  <circle cx="200" cy="201" r="5" fill="#00d4aa" filter="url(#glow)"/>
  <circle cx="1000" cy="201" r="5" fill="#7c3aed" filter="url(#glow)"/>
</svg>
