<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Code/tech decorative elements -->
  <g opacity="0.15">
    <text x="50" y="80" font-family="monospace" font-size="14" fill="#00d4ff">&lt;React /&gt;</text>
    <text x="150" y="120" font-family="monospace" font-size="14" fill="#7b2cbf">Node.js</text>
    <text x="950" y="100" font-family="monospace" font-size="14" fill="#00d4ff">TypeScript</text>
    <text x="1050" y="150" font-family="monospace" font-size="14" fill="#7b2cbf">PostgreSQL</text>
    <text x="100" y="320" font-family="monospace" font-size="14" fill="#00d4ff">Socket.io</text>
    <text x="980" y="340" font-family="monospace" font-size="14" fill="#7b2cbf">Next.js</text>
  </g>

  <!-- Main accent line -->
  <rect x="100" y="195" width="1000" height="3" fill="url(#accentGrad)" rx="1.5"/>

  <!-- Name -->
  <text x="600" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Beshah Ashenafi</text>

  <!-- Tagline -->
  <text x="600" y="230" text-anchor="middle" font-family="system-ui, -apple-syst em, sans-serif" font-size="28" fill="#a0a0a0">Full Stack Developer</text>

  <!-- Tech stack -->
  <text x="600" y="270" text-anchor="middle" font-family="monospace" font-size="16" fill="#00d4ff">Next.js • React • TypeScript • Node.js • PostgreSQL</text>

  <!-- Bottom accent -->
  <circle cx="100" cy="200" r="6" fill="#00d4ff"/>
  <circle cx="1100" cy="200" r="6" fill="#7b2cbf"/>
</svg>
